name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --group dev

      - name: Compile packages
        run: uv run python -m compileall -q apps packages

      - name: Import orchestrator main
        run: uv run python -c "from athena_orchestrator import main; assert callable(main)"

      - name: Pure unit tests
        run: uv run --package athena-orchestrator python -m unittest apps.orchestrator.tests.test_rules -q

      - name: Changelog ledger
        run: node scripts/check-changelog.mjs
