[project]
name = "athena-strategy-nfr"
version = "0.0.0"
description = "Paper NFR drafts"
requires-python = ">=3.12"
dependencies = ["athena-exec", "athena-marketdata", "athena-risk", "athena-settings", "athena-store"]

[tool.uv.sources]
athena-exec = { workspace = true }
athena-marketdata = { workspace = true }
athena-risk = { workspace = true }
athena-settings = { workspace = true }
athena-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena_strategy"]
